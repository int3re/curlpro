name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The native library is built by cgo, and cgo does not cross-compile without
# the target platform's toolchain. So every platform is built on itself rather
# than by one machine with GOOS/GOARCH flags.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            lib: libcurlpro.so
            plat: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            goarch: arm64
            lib: libcurlpro.so
            plat: manylinux_2_28_aarch64
          - os: macos-13
            goarch: amd64
            lib: libcurlpro.dylib
            plat: macosx_10_15_x86_64
          - os: macos-latest
            goarch: arm64
            lib: libcurlpro.dylib
            plat: macosx_11_0_arm64
          - os: windows-latest
            goarch: amd64
            lib: curlpro.dll
            plat: win_amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build native library
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -buildmode=c-shared -o "python/curlpro/lib/${{ matrix.lib }}" ./lib
          ls -la python/curlpro/lib/

      # The profiles travel inside the package: without them the library is
      # useless, and asking the user to fetch them separately is a step too many.
      - name: bundle the profiles
        shell: bash
        run: cp -r profiles python/curlpro/profiles

      - name: build wheel
        shell: bash
        run: |
          python -m pip install --upgrade build wheel
          cd python
          cp ../LICENSE ../NOTICE .
          python -m build --wheel
          # The platform tag is set explicitly: the wheel carries native code
          # and is not universal.
          python -m pip install wheel
          for w in dist/*.whl; do
            python -m wheel tags --platform-tag ${{ matrix.plat }} --remove "$w"
          done
          ls -la dist/

      # The check must pass on a day when browserleaks is down: a release
      # that waits for someone else's service is not a release. So the part
      # that must hold is local — the native library loads, the profiles are
      # inside the package, a session starts — and the oracle is asked
      # afterwards, for information only.
      - name: check the wheel installs and works
        shell: bash
        run: |
          python -m pip install python/dist/*.whl
          python -c "
          import curlpro, pathlib
          names = curlpro.load_profiles(pathlib.Path(curlpro.__file__).parent / 'profiles')
          assert 'chrome-151-windows' in names, names
          assert len(names) > 40, names
          with curlpro.Session('chrome-151-windows') as s:
              assert s.impersonate == 'chrome-151-windows'
          print('profiles:', len(names))
          "
      - name: ask the oracle (informational)
        shell: bash
        continue-on-error: true
        run: |
          python -c "
          import curlpro
          print('JA4:', curlpro.get('https://tls.browserleaks.com/json').json()['ja4'])
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: python/dist/*.whl

  # The source archive is for platforms with no wheel. It used to carry
  # neither the Go sources nor the profiles — 0 .go files, measured — so the
  # promise that it "builds the native part itself" was false: pip would
  # install a package that fails at import. It now carries the whole Go module
  # and the profiles, and building the native part is one command, named in
  # the README and in the error message the library raises when it cannot find
  # the library. pip still does not build it for you: that would require Go on
  # the user's machine at install time, which pip cannot promise either.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bundle the sources and the profiles
        shell: bash
        run: |
          cp -r profiles python/curlpro/profiles
          mkdir -p python/go
          cp -r internal lib go.mod go.sum python/go/
      - name: build the source archive
        shell: bash
        run: |
          python -m pip install --upgrade build
          cd python
          cp ../LICENSE ../NOTICE .
          python -m build --sdist
          ls -la dist/
      # What is inside is checked, not assumed: this is exactly where the
      # archive was empty before.
      - name: check the archive carries what it promises
        shell: bash
        run: |
          python - <<'PY'
          import glob, tarfile
          path = glob.glob("python/dist/*.tar.gz")[0]
          names = tarfile.open(path).getnames()
          go = [n for n in names if n.endswith(".go")]
          profiles = [n for n in names if "/profiles/" in n]
          print(f"{path}: {len(go)} .go, {len(profiles)} profiles")
          assert len(go) > 50, "no Go sources in the archive"
          assert len(profiles) > 40, "no profiles in the archive"
          assert any(n.endswith("go/go.mod") for n in names), "no go.mod"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  # Publishing goes the trusted way: PyPI verifies the signature of the run
  # itself in GitHub, and no token needs to be kept in secrets at all.
  #
  # The pypi environment is configured in the repository with a required
  # approval: a push to the public index cannot be taken back, and without it
  # one wrong tag would occupy a version for good.
  publish:
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: what is being published
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
