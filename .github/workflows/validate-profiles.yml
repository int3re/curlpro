name: validate-profiles

# Profiles go stale not from commits but from changes on the browsers' and the
# checking services' side. So the validation runs on a schedule rather than only
# on push: otherwise a divergence would surface at a user rather than in CI.
on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday
  workflow_dispatch:
  push:
    paths:
      - "profiles/**"
      - "internal/profile/**"
      - "internal/client/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Every profile's spec must build — a check of the data itself, needing
      # no network.
      - name: build every profile
        run: go run ./cmd/curlpro list

      # The external oracle breaks down under a burst, hence the pause between
      # profiles and the modest schedule.
      - name: compare the fingerprints
        run: |
          go run ./cmd/curlpro validate \
            -oracle https://tls.browserleaks.com/json \
            -baselines reference/baselines \
            -pause 2s

      - name: show the divergences
        if: failure()
        run: |
          echo "A fingerprint diverged from its reference."
          echo "If the change is expected (a profile or a service moved on),"
          echo "refresh the reference: curlpro validate -update"
          git diff --stat reference/baselines || true
