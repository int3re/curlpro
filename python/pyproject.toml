[build-system]
# 77, not 68: the PEP 639 form below (a SPDX string in license= plus
# license-files=) is rejected by anything older, and a declared floor that
# does not build is worse than no floor.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "curlpro"
version = "0.4.1"
description = "HTTP client with a browser's network fingerprint: TLS ClientHello, HTTP/2 and HTTP/3 frames, header order"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
# LICENSE and NOTICE are copied here when the wheel is built (wheels.yml),
# as are the native library and the profiles: in the tree they live at the
# root, and keeping a second copy is the straight road to divergence.
license-files = ["LICENSE*", "NOTICE*"]
keywords = ["tls", "ja3", "ja4", "http2", "http3", "quic", "fingerprint", "impersonate", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Go",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/int3re/curlpro"
Issues = "https://github.com/int3re/curlpro/issues"
Changelog = "https://github.com/int3re/curlpro/blob/main/ROADMAP.md"

[tool.setuptools]
packages = ["curlpro"]

# The wheel carries the native library and the profiles: without the profiles
# the library is useless, and asking the user to fetch them separately is a step
# too many. Both directories are filled at build time
# (.github/workflows/wheels.yml).
[tool.setuptools.package-data]
curlpro = ["lib/*", "profiles/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Tests that need someone else's service: httpbin, browserleaks,
    # cloudflare-quic. The main run is -m "not network" and therefore
    # deterministic; these go to a job of their own, where an outage upstream
    # does not colour the build.
    "network: goes to the internet rather than to a local stand",
]
